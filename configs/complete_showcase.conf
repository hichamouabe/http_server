
# SERVER 1: Main Server on Port 8080
server {
    listen 8080;
    server_name localhost;
    client_max_body_size 50M;

    # Custom Error Pages
    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 500 502 503 504 /errors/5xx.html;

    # 1. Main Static site with Directory Listing
    location / {
        root ./www;
        index index.html;
        autoindex on;
        limit_except GET {
            deny all;
        }
    }

    # 2. PHP CGI Endpoint
    location /cgi-php {
        root ./www/cgi-bin;
        limit_except GET POST {
            deny all;
        }
        # Assuming linux. Change to /opt/homebrew/bin/php-cgi if on Mac ARM
        cgi_pass .php /usr/bin/php-cgi; 
    }

    # 3. Python CGI Endpoint
    location /cgi-py {
        root ./www/cgi-bin;
        limit_except GET POST {
            deny all;
        }
        cgi_pass .py /usr/bin/python3;
    }

    # 4. Upload & Delete Endpoint
    location /upload {
        root ./www/upload;
        upload_store ./www/upload;
        limit_except GET POST DELETE {
            deny all;
        }
    }

    # 5. Redirection Endpoint
    location /redirect {
        return 301 http://github.com;
    }
}

# SERVER 2: Virtual Hosting (Same port 8080, different server_name)
server {
    listen 8080;
    server_name site1.local;
    client_max_body_size 10M;

    location / {
        root ./www/site1;
        index index.html;
        autoindex on;
    }
}

# SERVER 3: Different Port (8081)
server {
    listen 8081;
    server_name localhost;
    client_max_body_size 5M;

    location / {
        root ./www/site2;
        index index.html;
        autoindex on;
        limit_except GET {
            deny all;
        }
    }
}
